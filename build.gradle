plugins {
	id 'net.fabricmc.fabric-loom-remap' version '1.15-SNAPSHOT'
}

base {
	archivesName = "${project.archives_base_name}-mc${project.minecraft_version}"
	version = project.mod_version + "." + getVersionSuffix()
	group = project.maven_group
}

loom {

	useIntermediateMappings = true
	intermediaryUrl = 'https://repo.codemc.io/repository/relativitymc/org/relativitymc/intermediary/%1$s/intermediary-%1$s-v2.jar'

}

repositories.named("Mojang", MavenArtifactRepository) {
	artifactUrls ArtifactRepositoryContainer.MAVEN_CENTRAL_URL
}

configurations {
	api.extendsFrom includeApi
}

repositories {
	    mavenCentral()
		maven {
		url = "https://repo.codemc.io/repository/relativitymc/"
    }
    maven {
        name = 'ClothConfig'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'ModMenu'
        url = 'https://maven.terraformersmc.com/releases/'
	}
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "org.relativitymc:modern-yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    //Fabric api
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    //Mod Menu
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    //Cloth Config
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
}

afterEvaluate {
	migrateMappings.configure {
		outputDir = project.file("build/remappedSrc")
		doLast {
			copy {
				from project.file("build/remappedSrc")
				into project.file("src/client/java")
				into project.file("src/main/java")
			}
		}
	}
}

processResources {
	inputs.property "version", project.version + "+" + project.minecraft_version

	filesMatching("fabric.mod.json") {
		expand "version": project.version + "+" + project.minecraft_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// THIS 'jar' TASK IS NOW CORRECT AND SAFE
jar {
	from("LICENSE") {
		// Use the safe final variable for the rename operation.
		rename { "${it}_${archivesBaseName}" }
	}
}

// THIS 'publishing' BLOCK IS NOW CORRECT AND SAFE
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			// Use the safe final variable for the artifactId.
			artifactId = archivesBaseName
			from components.java
		}
	}

	repositories {
		// Repositórios para publicação viriam aqui
	}
}
