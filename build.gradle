plugins {
	id 'net.fabricmc.fabric-loom' version "1.16-SNAPSHOT"
	id 'maven-publish'
}

// --- CONFIGURATION CACHE-SAFE VARIABLES ---
// Read all values needed by tasks from the project object here.
// These final variables are safe to use in task actions below.
final String modVersionForExpansion = project.version
final String archivesBaseName = project.archives_base_name

version = project.mod_version
group = project.maven_group

base {
	// The value is set here using the safe variable.
	archivesName = archivesBaseName
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"barium" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
    mavenCentral()
    maven {
        name = 'ClothConfig'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'ModMenu'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    //Fabric api
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    //Mod Menu
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    //Cloth Config
    implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
}

processResources {
	filesMatching("fabric.mod.json") {
		expand("version": modVersionForExpansion)
	}
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = targetJavaVersion
	it.options.deprecation = true
}

java {
	def javaVersion = JavaVersion.toVersion(targetJavaVersion)
	if (JavaVersion.current() < javaVersion) {
		toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
	}

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	//withSourcesJar()
}

// THIS 'jar' TASK IS NOW CORRECT AND SAFE
jar {
	from("LICENSE") {
		// Use the safe final variable for the rename operation.
		rename { "${it}_${archivesBaseName}" }
	}
}

// THIS 'publishing' BLOCK IS NOW CORRECT AND SAFE
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			// Use the safe final variable for the artifactId.
			artifactId = archivesBaseName
			from components.java
		}
	}

	repositories {
		// Repositórios para publicação viriam aqui
	}
}
